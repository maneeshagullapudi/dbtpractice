version: 2

sources:
  - name: zomato_engagement
    description: >
      Customer ratings and reviews from the Zomato Review API (Cassandra → Airbyte).
      Ratings are submitted post-delivery via push notification. Reviews are optional text.
      Data quality consideration: ~15% of delivered orders never receive a rating.
    database: RAW
    schema: ZOMATO_ENGAGEMENT
    loader: airbyte

    tables:
      - name: ratings
        description: >
          One row per rating submission. Customers can rate food quality AND delivery
          separately. The overall_rating is a weighted average computed in the app.
          Ratings submitted within 30 minutes of order completion may be
          incentivized (restaurant-prompted) — flagged via the is_likely_incentivized column.
        columns:
          - name: rating_id
            description: UUID primary key.
            data_tests:
              - not_null
              - unique
          - name: order_id
            description: FK to orders.order_id. Only delivered orders can have ratings.
            data_tests:
              - not_null
          - name: customer_id
            data_tests:
              - not_null
          - name: restaurant_id
            data_tests:
              - not_null
          - name: food_rating
            description: Star rating for food quality (1-5).
            data_tests:
              - dbt_expectations.expect_column_values_to_be_between:
                  arguments:
                    min_value: 1
                    max_value: 5
          - name: delivery_rating
            description: Star rating for delivery experience (1-5).
            data_tests:
              - dbt_expectations.expect_column_values_to_be_between:
                  arguments:
                    min_value: 1
                    max_value: 5
          - name: overall_rating
            description: Composite rating (weighted average of food and delivery).
            data_tests:
              - not_null
              - dbt_expectations.expect_column_values_to_be_between:
                  arguments:
                    min_value: 1
                    max_value: 5
          - name: rated_at
            description: UTC timestamp of rating submission.
            data_tests:
              - not_null

      - name: reviews
        description: >
          Optional text reviews submitted alongside ratings. Not all ratings have reviews.
          Contains free-form text — not used directly in SQL analytics, but fed to
          the NLP sentiment pipeline via Snowpark.
        columns:
          - name: review_id
            data_tests:
              - not_null
              - unique
          - name: rating_id
            description: FK to ratings.rating_id.
            data_tests:
              - not_null
          - name: review_text
            description: Customer-written review text (potentially PII — names, phone numbers).
          - name: sentiment_label
            description: ML-computed sentiment (positive/neutral/negative).
          - name: submitted_at
            data_tests:
              - not_null
