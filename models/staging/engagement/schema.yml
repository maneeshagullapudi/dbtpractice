version: 2

models:
  - name: stg_ratings
    description: >
      Staging model for customer order ratings, including food, delivery, and
      overall satisfaction signals.

      Grain: one row per rating_id.
    columns:
      - name: rating_id
        description: Natural rating identifier.
        data_tests:
          - not_null
          - unique
      - name: order_id
        description: Foreign key to the rated order.
        data_tests:
          - not_null
      - name: customer_id
        description: Foreign key to the customer who submitted the rating.
      - name: restaurant_id
        description: Foreign key to the rated restaurant.
      - name: delivery_partner_id
        description: Foreign key to the delivery partner for the rated order.
      - name: food_rating
        description: Food rating on a 1-5 scale.
      - name: delivery_rating
        description: Delivery rating on a 1-5 scale.
      - name: overall_rating
        description: Overall rating on a 1-5 scale.
        data_tests:
          - not_null
      - name: is_positive
        description: Flag for ratings with overall_rating of at least 4.
      - name: is_negative
        description: Flag for ratings with overall_rating below 3.
      - name: rated_at
        description: Timestamp when the rating was submitted.
        data_tests:
          - not_null
      - name: _loaded_at
        description: Source extraction timestamp.
        data_tests:
          - not_null
