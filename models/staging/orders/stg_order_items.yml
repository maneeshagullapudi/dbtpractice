version: 2

models:
  - name: stg_order_items
    description: >
      Staging model for order line items. One row per item per order.
      An order with 3 menu items has 3 rows in this table.

      Grain: one row per order_item_id.

    columns:
      - name: order_item_id
        description: UUID primary key from the source Orders API.
        data_tests:
          - not_null
          - unique

      - name: order_id
        description: FK to stg_orders. The parent order for this line item.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_orders')
                field: order_id

      - name: menu_item_id
        description: FK to the restaurant's menu item.
        data_tests:
          - not_null

      - name: restaurant_id
        description: Denormalized restaurant FK for query convenience.
        data_tests:
          - not_null

      - name: quantity
        description: Number of units of this menu item ordered.
        data_tests:
          - not_null
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 1
                max_value: 50       # Sanity check: no order should have 50+ of the same item

      - name: unit_price
        description: Price per unit in rupees at the time of ordering.
        data_tests:
          - not_null
          - not_negative

      - name: item_subtotal
        description: unit_price × quantity. Computed in staging for reconciliation tests.
        data_tests:
          - not_null
          - not_negative

      - name: is_vegetarian
        description: Whether the ordered item is vegetarian (FSSAI green dot).
