version: 2

sources:
  - name: zomato_transactional
    description: >
      Core transactional source system for all order-related data.
      Loaded by Fivetran via CDC from the Zomato Orders PostgreSQL database.
      This source contains the most business-critical tables — any freshness
      failures here will immediately impact Finance and Operations dashboards.
    database: RAW
    schema: ZOMATO_TRANSACTIONAL
    loader: fivetran

    tables:
      - name: orders
        description: >
          One row per customer order. Contains order lifecycle status, amounts,
          restaurant assignment, and delivery partner assignment.
          This is the most critical table in the platform — GMV, retention,
          and operations metrics all derive from here.
        columns:
          - name: order_id
            description: UUID primary key from the Orders API.
            data_tests:
              - not_null
              - unique
          - name: customer_id
            description: FK to customers.customer_id.
            data_tests:
              - not_null
          - name: restaurant_id
            description: FK to restaurants.restaurant_id.
            data_tests:
              - not_null
          - name: order_status
            description: Current status in the order lifecycle.
            data_tests:
              - not_null
              - accepted_values:
                  arguments:
                    values: ['pending', 'accepted', 'preparing', 'out_for_delivery',
                             'delivered', 'cancelled', 'refunded', 'test_order']
          - name: total_amount
            description: Order total in rupees including delivery fee, taxes, and platform fee.
            data_tests:
              - not_null
          - name: ordered_at
            description: UTC timestamp when customer submitted the order.
            data_tests:
              - not_null
          - name: _fivetran_synced
            description: Timestamp when Fivetran last synced this row.
            data_tests:
              - not_null

      - name: order_items
        description: >
          One row per line item within an order. An order with 3 menu items
          has 3 rows in this table. Contains item-level pricing and quantities.
        columns:
          - name: order_item_id
            description: UUID primary key.
            data_tests:
              - not_null
              - unique
          - name: order_id
            description: FK to orders.order_id.
            data_tests:
              - not_null
          - name: menu_item_id
            description: FK to restaurants.menu_items.menu_item_id.
            data_tests:
              - not_null
          - name: quantity
            description: Number of units of this item ordered.
            data_tests:
              - not_null
          - name: unit_price
            description: Price per unit at time of order in rupees.
            data_tests:
              - not_null
