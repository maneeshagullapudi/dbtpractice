version: 2

sources:
  - name: zomato_promotions
    description: >
      Promotional campaigns and coupon redemption data from the Zomato Promotions DB (MySQL).
      Promotions can be platform-funded (cost to Zomato) or restaurant-funded (cost to restaurant).
      Attribution is critical — promo_funder drives financial allocation in fct_revenue.
    database: RAW
    schema: ZOMATO_PROMOTIONS
    loader: fivetran

    tables:
      - name: promotions
        description: >
          One row per promotional campaign. Campaigns have validity periods,
          discount types (percentage vs fixed), and eligibility rules
          (new users only, minimum order value, specific restaurants).
        columns:
          - name: promo_id
            description: UUID primary key.
            data_tests:
              - not_null
              - unique
          - name: promo_code
            description: Customer-facing coupon code (e.g., ZOMATO50).
            data_tests:
              - not_null
              - unique
          - name: discount_type
            description: How the discount is calculated.
            data_tests:
              - not_null
              - accepted_values:
                  arguments:
                    values: ['percentage', 'flat', 'free_delivery', 'bogo']
          - name: discount_value
            description: Discount amount (% for percentage type, ₹ for flat_amount).
            data_tests:
              - not_null
          - name: promo_funder
            description: Who funds this promotion.
            data_tests:
              - not_null
              - accepted_values:
                  arguments:
                    values: ['zomato', 'restaurant', 'shared', 'payment_partner']
          - name: valid_from
            data_tests:
              - not_null
          - name: valid_to
            data_tests:
              - not_null
          - name: max_redemptions
            description: Maximum number of times this promo can be used (NULL = unlimited).
          - name: min_order_value
            description: Minimum order value to qualify for this promo.

      - name: promo_redemptions
        description: >
          One row per promo code applied to an order. An order can have at most
          one promo code applied (enforced at API level). Records all successful
          and failed redemption attempts.
        columns:
          - name: redemption_id
            description: UUID primary key.
            data_tests:
              - not_null
              - unique
          - name: order_id
            data_tests:
              - not_null
          - name: promo_id
            data_tests:
              - not_null
          - name: customer_id
            data_tests:
              - not_null
          - name: discount_amount_applied
            description: Actual discount applied to this order in rupees.
            data_tests:
              - not_null
          - name: redemption_status
            data_tests:
              - accepted_values:
                  arguments:
                    values: ['success', 'failed', 'reversed']
          - name: redeemed_at
            data_tests:
              - not_null
