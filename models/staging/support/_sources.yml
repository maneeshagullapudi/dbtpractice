version: 2

sources:
  - name: zomato_support
    description: >
      Customer support ticket data from Salesforce Service Cloud (via Airbyte).
      Contains all customer complaints, queries, and resolution records.
      Ticket volume and resolution time are key CX quality metrics.
    database: RAW
    schema: ZOMATO_SUPPORT
    loader: airbyte

    tables:
      - name: support_tickets
        description: >
          One row per customer support ticket. Tickets can be linked to an order
          (most common) or standalone account queries. Linked to the order system via order_id.
          Ticket types and resolution codes are defined by the CX operations team.
        columns:
          - name: ticket_id
            description: Salesforce case ID.
            data_tests:
              - not_null
              - unique
          - name: customer_id
            data_tests:
              - not_null
          - name: order_id
            description: FK to orders.order_id. NULL for non-order tickets.
          - name: ticket_category
            description: High-level ticket classification.
            data_tests:
              - not_null
              - accepted_values:
                  arguments:
                    values: ['missing_item', 'wrong_item', 'late_delivery', 'damaged_food',
                             'payment_issue', 'refund_request', 'account_issue',
                             'delivery_partner_complaint', 'restaurant_complaint', 'other']
          - name: ticket_status
            description: Current status of the support ticket.
            data_tests:
              - not_null
              - accepted_values:
                  arguments:
                    values: ['open', 'in_progress', 'waiting_on_customer',
                             'resolved', 'closed', 'escalated']
          - name: priority
            description: Ticket priority set by the support system.
            data_tests:
              - accepted_values:
                  arguments:
                    values: ['low', 'medium', 'high', 'critical']
          - name: resolution_code
            description: How the ticket was resolved.
            data_tests:
              - accepted_values:
                  arguments:
                    values: ['full_refund', 'partial_refund', 'replacement_sent', 'no_action']
          - name: created_at
            description: Timestamp when ticket was raised.
            data_tests:
              - not_null
          - name: first_response_at
            description: Timestamp of first agent response.
          - name: resolved_at
            description: Timestamp when ticket was marked resolved.
          - name: csat_score
            description: Customer satisfaction score (1-5) submitted after resolution.
            data_tests:
              - dbt_expectations.expect_column_values_to_be_between:
                  arguments:
                    min_value: 1
                    max_value: 5
                    row_condition: "csat_score is not null"

      - name: ticket_comments
        description: >
          Individual comments/messages within a support ticket thread.
          Contains customer messages and agent responses.
          Not used directly in analytics — feeds NLP pipeline for intent detection.
        columns:
          - name: comment_id
            data_tests:
              - not_null
              - unique
          - name: ticket_id
            data_tests:
              - not_null
          - name: commenter_type
            data_tests:
              - accepted_values:
                  arguments:
                    values: ['customer', 'agent', 'system']
          - name: commented_at
            data_tests:
              - not_null
