version: 2

models:
  - name: stg_support_tickets
    description: >
      Staging model for customer support tickets with normalized status values
      and derived response and resolution SLA metrics.

      Grain: one row per ticket_id.
    columns:
      - name: ticket_id
        description: Natural support ticket identifier.
        data_tests:
          - not_null
          - unique
      - name: customer_id
        description: Foreign key to the customer who opened the ticket.
      - name: order_id
        description: Foreign key to the related order when the ticket is order-specific.
      - name: assigned_agent_id
        description: Identifier for the support agent assigned to the ticket.
      - name: ticket_category
        description: Normalized support ticket category.
        data_tests:
          - not_null
      - name: ticket_status
        description: Normalized support ticket status.
        data_tests:
          - not_null
      - name: priority
        description: Normalized support ticket priority.
      - name: resolution_code
        description: Resolution code assigned when the ticket is closed.
      - name: csat_score
        description: Customer satisfaction score for the ticket interaction.
      - name: is_positive_csat
        description: Flag for tickets with CSAT of at least 4.
      - name: created_at
        description: Ticket creation timestamp.
        data_tests:
          - not_null
      - name: first_response_at
        description: Timestamp of the first agent response.
      - name: resolved_at
        description: Timestamp when the ticket was resolved.
      - name: minutes_to_first_response
        description: Derived minutes between ticket creation and first response.
      - name: minutes_to_resolution
        description: Derived minutes between ticket creation and resolution.
      - name: updated_at
        description: Source-system last update timestamp.
        data_tests:
          - not_null
      - name: _loaded_at
        description: Source extraction timestamp.
        data_tests:
          - not_null
