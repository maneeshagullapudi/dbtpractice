version: 2

models:
  - name: stg_cities
    description: >
      Staging model for delivery cities and city-tier reference attributes.
      Filters to active cities when reading from raw sources.

      Grain: one row per city_id.
    columns:
      - name: city_id
        description: Natural city identifier.
        data_tests:
          - not_null
          - unique
      - name: city_name
        description: Human-readable city name.
        data_tests:
          - not_null
      - name: state
        description: State associated with the city.
      - name: city_tier
        description: Commercial city tier used for segmentation and planning.
        data_tests:
          - not_null
      - name: is_metro
        description: Whether the city is classified as a metro market.
      - name: is_active
        description: Whether the city is currently active for operations.
      - name: launch_date
        description: Date the city launched on the platform.
      - name: _loaded_at
        description: Source sync timestamp.
        data_tests:
          - not_null
