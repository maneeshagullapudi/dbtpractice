version: 2

sources:
  - name: zomato_customers
    description: >
      Customer master data from the Zomato Customer Service (PostgreSQL), loaded
      by Fivetran. Contains sensitive customer attributes, including direct PII,
      so downstream models should apply masking rules where appropriate.
    database: RAW
    schema: ZOMATO_CUSTOMERS
    loader: fivetran

    tables:
      - name: customers
        description: >
          One row per registered customer account in the source application.
          Includes profile attributes, lifecycle flags, acquisition metadata, and
          source-system timestamps used downstream for staging and customer marts.
        columns:
          - name: customer_id
            description: UUID primary key for the customer account.
            data_tests:
              - not_null
              - unique
          - name: customer_name
            description: Customer full name from the source system.
            data_tests:
              - not_null
          - name: customer_email
            description: Customer email address. Sensitive PII that is masked downstream in non-production environments.
            data_tests:
              - not_null
          - name: customer_phone
            description: Customer mobile number in Indian format. Sensitive PII that is masked downstream in non-production environments.
          - name: city_id
            description: Source city identifier associated with the customer's registered city.
            data_tests:
              - not_null
          - name: acquisition_channel
            description: Channel through which the customer was first acquired.
            data_tests:
              - accepted_values:
                  arguments:
                    values: ['organic', 'paid_social', 'referral', 'promo', 'app_store', 'unknown']
          - name: customer_segment
            description: CRM-assigned customer segment based on recency, frequency, and spend behavior.
          - name: is_active
            description: Whether the customer account is currently active in the source system.
          - name: is_pro_subscriber
            description: Whether the customer has an active Zomato Pro subscription.
          - name: created_at
            description: UTC timestamp when the customer account was created.
            data_tests:
              - not_null
          - name: last_login_at
            description: UTC timestamp of the customer's most recent application login.
          - name: updated_at
            description: UTC timestamp of the most recent source-system update for the customer record.
          - name: _fivetran_synced
            description: Timestamp when Fivetran last synced this record from the source system.

      - name: customer_addresses
        description: >
          Customer delivery addresses. One customer can have multiple saved addresses.
          Contains PII (address text, GPS coordinates). Not exposed in mart layer.
        columns:
          - name: address_id
            description: UUID primary key.
            data_tests:
              - not_null
              - unique
          - name: customer_id
            description: Customer identifier for the address owner.
            data_tests:
              - not_null
          - name: is_default
            description: Whether this is the customer's default delivery address.
