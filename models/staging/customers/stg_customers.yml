version: 2

models:
  - name: stg_customers
    description: >
      Staging model for customer master data. One row per registered customer.
      PII columns (email, phone) are masked in non-production environments
      via the mask_pii() macro. Production access to unmasked data is governed
      by the ZOMATO_PII_ANALYST_ROLE.

      Grain: one row per customer_id.

    columns:
      - name: customer_id
        description: UUID primary key from the Customer Service.
        data_tests:
          - not_null
          - unique

      - name: customer_name
        description: Customer full name. Not masked (name alone is not sensitive in analytics context).
        data_tests:
          - not_null

      - name: customer_email
        description: Customer email address. PII — masked to '***REDACTED***' in dev/staging/CI.
        data_tests:
          - not_null

      - name: customer_phone
        description: Customer mobile number in Indian format. PII — masked in non-prod.

      - name: city_id
        description: FK to stg_cities. The customer's registered city.
        data_tests:
          - not_null

      - name: acquisition_channel
        description: Channel through which the customer first registered.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['organic', 'paid_social', 'referral', 'promo', 'app_store', 'unknown']

      - name: customer_segment
        description: >
          Value segment assigned by the CRM system based on order frequency and spend.
          premium: > 8 orders/month or LTV > ₹10,000
          regular: 3-8 orders/month
          occasional: 1-2 orders/month
          new: < 30 days since first order
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['premium', 'regular', 'occasional', 'new']

      - name: is_active
        description: Whether the customer account is active (not deleted or suspended).
        data_tests:
          - not_null

      - name: is_pro_subscriber
        description: Whether the customer has an active Zomato Pro subscription.
        data_tests:
          - not_null

      - name: created_at
        description: UTC timestamp when the customer registered.
        data_tests:
          - not_null

      - name: last_login_at
        description: UTC timestamp of the customer's most recent app login.

      - name: updated_at
        description: UTC timestamp of last update. Used as SCD2 snapshot trigger.
        data_tests:
          - not_null

      - name: _loaded_at
        description: Fivetran sync timestamp.
        data_tests:
          - not_null
