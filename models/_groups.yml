version: 2

groups:
  - name: platform
    description: Shared internal transformation layer used to standardize sources, reusable joins, and utility models.
    owner:
      name: Analytics Engineering
      email: data-platform@zomato.internal
    config:
      meta:
        purpose: internal_platform
        data_classification: internal

  - name: finance
    description: Published finance marts and metrics used for revenue, refunds, and reconciliation workflows.
    owner:
      name: Finance Analytics
      email: finance-analytics@zomato.internal
    config:
      meta:
        purpose: published_domain_mart
        data_classification: sensitive

  - name: customers
    description: Customer analytics marts powering retention, lifecycle, and CRM use cases.
    owner:
      name: Customer Analytics
      email: customer-analytics@zomato.internal
    config:
      meta:
        purpose: published_domain_mart
        data_classification: internal

  - name: restaurants
    description: Restaurant performance marts used by partnerships and marketplace operations.
    owner:
      name: Restaurant Analytics
      email: restaurant-analytics@zomato.internal
    config:
      meta:
        purpose: published_domain_mart
        data_classification: internal

  - name: operations
    description: Operational delivery marts supporting SLA monitoring, dispatch analysis, and incident investigation.
    owner:
      name: Operations Analytics
      email: operations-analytics@zomato.internal
    config:
      meta:
        purpose: published_domain_mart
        data_classification: internal
