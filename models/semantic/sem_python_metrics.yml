version: 2

metrics:
  - name: repeat_customer_rate_py
    label: Repeat Customer Rate (Python)
    description: Share of active customers that are repeat customers in the Python retention mart.
    type: ratio
    numerator: repeat_customers_py
    denominator: active_customers_py

  - name: customer_retention_90d_rate_py
    label: Customer Retention 90D Rate (Python)
    description: Share of active customers retained within 90 days in the Python retention mart.
    type: ratio
    numerator: retained_customers_90d_py
    denominator: active_customers_py

  - name: average_customer_engagement_score_py
    label: Average Customer Engagement Score (Python)
    description: Average engagement score derived from the Python customer feature mart.
    type: ratio
    numerator: customer_engagement_score_total
    denominator: customer_feature_rows

  - name: restaurants_needing_attention_rate_py
    label: Restaurants Needing Attention Rate (Python)
    description: Share of restaurants currently flagged for intervention.
    type: ratio
    numerator: restaurants_needing_attention
    denominator: restaurant_count

  - name: delivery_on_time_rate_py
    label: Delivery On-Time Rate (Python)
    description: Share of successful deliveries that were on time in the Python service-level mart.
    type: ratio
    numerator: on_time_deliveries_py
    denominator: successful_deliveries_py

  - name: average_restaurant_health_score_py
    label: Average Restaurant Health Score (Python)
    description: Average health score across restaurants from the Python restaurant health mart.
    type: ratio
    numerator: restaurant_health_score_total
    denominator: restaurant_count
