metrics:
  - name: gross_merchandise_value
    label: GMV
    description: Total order value before deductions. Top-line growth metric.
    type: derived
    expr: gross_revenue
    input_metrics:
      - name: gross_revenue

  - name: total_orders
    label: Total Orders
    description: Count of all orders placed (includes cancelled).
    type: derived
    expr: order_count
    input_metrics:
      - name: order_count

  - name: average_order_value
    label: AOV
    description: GMV divided by delivered orders. Key indicator of customer spending.
    type: ratio
    numerator: gross_revenue
    denominator: delivered_order_count

  - name: net_platform_revenue
    label: Net Revenue
    description: Revenue after refunds and platform-funded promotions.
    type: derived
    expr: net_revenue
    input_metrics:
      - name: net_revenue

  - name: promo_spend
    label: Promotional Spend
    description: Total promotional discounts applied to orders.
    type: derived
    expr: promo_discount_amount
    input_metrics:
      - name: promo_discount_amount
