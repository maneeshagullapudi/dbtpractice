version: 2

models:
  - name: fct_deliveries
    description: >
      Delivery fact table that joins delivery execution events with order context
      for operational performance analysis.

      Grain: one row per delivery_id.
      Incremental strategy: microbatch on assigned_at with daily batches and a
      one-batch lookback for late-arriving records.
    config:
      contract:
        enforced: true
    columns:
      - name: delivery_id
        data_type: varchar
        description: Natural delivery identifier.
        data_tests:
          - not_null
          - unique
      - name: order_id
        data_type: varchar
        description: Foreign key to the delivered order.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('fct_revenue')
                field: order_id
      - name: delivery_partner_id
        data_type: varchar
        description: Foreign key to the assigned delivery partner.
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_delivery_partners')
                field: delivery_partner_id
      - name: customer_id
        data_type: varchar
        description: Foreign key to the customer who placed the order.
      - name: restaurant_id
        data_type: varchar
        description: Foreign key to the restaurant fulfilling the order.
      - name: city_id
        data_type: varchar
        description: Foreign key to the delivery city.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_cities')
                field: city_id
      - name: city_name
        data_type: varchar
        description: Denormalized city name for operational reporting.
      - name: city_tier
        data_type: varchar
        description: Denormalized city tier for SLA segmentation.
      - name: vehicle_type
        data_type: varchar
        description: Vehicle type used by the assigned delivery partner.
      - name: delivery_status
        data_type: varchar
        description: Final delivery execution status.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['assigned', 'picked_up', 'in_transit', 'out_for_delivery', 'delivered', 'failed', 'cancelled']
      - name: failure_reason
        data_type: varchar
        description: Failure reason recorded for unsuccessful or cancelled deliveries.
      - name: is_on_time_delivery
        data_type: boolean
        description: Whether the delivery met the SLA target.
      - name: is_sla_breach
        data_type: boolean
        description: Whether the delivery breached the SLA target.
      - name: total_delivery_minutes
        data_type: number(38, 0)
        description: Total minutes from order placement to successful delivery.
      - name: delivery_distance_km
        data_type: number(38, 6)
        description: Straight-line or measured delivery distance in kilometers.
      - name: route_distance_km
        data_type: number(38, 6)
        description: Route distance traveled in kilometers.
      - name: minutes_partner_to_restaurant
        data_type: number(38, 0)
        description: Minutes from assignment until the partner reaches the restaurant.
      - name: minutes_restaurant_to_customer
        data_type: number(38, 0)
        description: Minutes from pickup until the order is delivered to the customer.
      - name: total_amount
        data_type: number(38, 6)
        description: Total order value associated with the delivery.

      - name: assigned_at
        data_type: timestamp_ntz
        description: Timestamp when the delivery was assigned to a partner.
      - name: picked_up_at
        data_type: timestamp_ntz
        description: Timestamp when the partner picked up the order from the restaurant.
      - name: delivered_at
        data_type: timestamp_ntz
        description: Timestamp when the order was delivered to the customer.
      - name: ordered_at
        data_type: timestamp_ntz
        description: Timestamp when the underlying order was placed.
      - name: order_date
        data_type: date
        description: Calendar date of the related order.
        data_tests:
          - not_null
      - name: updated_at
        data_type: timestamp_ntz
        description: Source-system last update timestamp from the delivery source.
        data_tests:
          - not_null
      - name: _dbt_loaded_at
        data_type: timestamp_ntz
        description: Timestamp when this mart row was loaded by dbt.
      - name: _dbt_invocation_id
        data_type: varchar
        description: dbt invocation identifier for the run that produced this row.
      - name: _dbt_run_started_at
        data_type: timestamp_ntz
        description: Timestamp when the dbt run that built this row started.
      - name: _dbt_model_id
        data_type: varchar
        description: Internal dbt model identifier for lineage and auditing.
      - name: src_load_dts
        data_type: timestamp_ntz
        description: Source load timestamp propagated into the mart for auditing.
      - name: src_filename
        data_type: varchar
        description: Source relation name recorded for lineage tracing.
      - name: src_record_source
        data_type: varchar
        description: Source-system identifier describing where the record originated.
      - name: src_batch_id
        data_type: varchar
        description: Batch identifier associated with the source ingestion event.
      - name: src_hash
        data_type: varchar
        description: Row-level hash used to detect source record changes.


  - name: fct_delivery_event_log
    description: >
      Append-only delivery lifecycle event log derived from delivery assignment
      timestamps. One delivery can produce multiple events as it progresses
      through the workflow.

      Grain: one row per (delivery_id, event_type, event_at).
      Incremental strategy: append. Existing event rows are excluded during
      incremental runs so only newly observed lifecycle events are appended.
    config:
      meta:
        domain: operations
        owner: vp_operations
        strategy_template: append_event_log
        dashboard_ready: true
    columns:
      - name: delivery_event_key
        description: Surrogate key generated from delivery_id, event_type, and event_at.
        data_tests:
          - not_null
          - unique
      - name: delivery_id
        description: Natural delivery identifier.
        data_tests:
          - not_null
      - name: order_id
        description: Foreign key to the related order.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('fct_revenue')
                field: order_id
      - name: delivery_partner_id
        description: Delivery partner responsible for the delivery at event time.
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_delivery_partners')
                field: delivery_partner_id
      - name: city_id
        description: City associated with the related order.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_cities')
                field: city_id
      - name: event_type
        description: >
          Lifecycle milestone represented by the row. Use with sequence_in_delivery
          to reconstruct the delivery journey or measure drop-off between stages.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['assigned', 'en_route_restaurant', 'arrived_restaurant', 'picked_up', 'delivered']
      - name: event_at
        description: >
          Timestamp when the lifecycle event occurred. This is the primary time axis
          for timeline analysis, event volumes, and stage-latency calculations.
        data_tests:
          - not_null
      - name: sequence_in_delivery
        description: >
          Numeric ordering of the event within the delivery lifecycle. Lower values
          occur earlier in the journey and can be used to sort events reliably.
        data_tests:
          - not_null
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 1
                max_value: 5
      - name: latest_delivery_status
        description: >
          Latest status recorded on the underlying delivery row when this event was
          emitted. Useful for comparing a historical milestone to the current known
          state of the delivery.
      - name: failure_reason
        description: >
          Failure reason from the delivery source row, when present. Most useful for
          failed deliveries or RCA workflows that join the event log back to the
          current delivery state.
      - name: source_delivery_updated_at
        description: >
          Source-system update timestamp of the delivery row that produced the event.
          Useful for debugging when the event was first observed in warehouse syncs.
        data_tests:
          - not_null

  - name: fct_delivery_sla_hourly
    description: >
      Hourly delivery SLA aggregate by city for near-realtime operational
      monitoring.

      Grain: one row per (delivery_hour, city_id).
      Incremental strategy: insert_overwrite. Recent hourly buckets are fully
      recomputed and replaced during incremental runs.
    config:
      meta:
        domain: operations
        owner: vp_operations
        strategy_template: insert_overwrite_time_bucket
        dashboard_ready: true
    columns:
      - name: delivery_hour
        description: >
          Start timestamp of the hourly bucket in which the related order was placed.
          Use this as the primary time dimension for intraday SLA monitoring.
        data_tests:
          - not_null
      - name: city_id
        description: Foreign key to the city for the hourly SLA aggregation.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_cities')
                field: city_id
      - name: total_deliveries
        description: Total deliveries counted for the hour and city.
        data_tests:
          - not_null
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 0
      - name: successful_deliveries
        description: Deliveries completed successfully in the hour.
        data_tests:
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 0
      - name: failed_deliveries
        description: Deliveries that failed in the hour.
        data_tests:
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 0
      - name: on_time_delivery_rate
        description: >
          Share of successful deliveries in the hour that met the SLA target.
          Best used for real-time city performance monitoring.
        data_tests:
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 0
                max_value: 1
      - name: sla_breach_rate
        description: >
          Share of successful deliveries in the hour that breached the SLA window.
          Use alongside on_time_delivery_rate to monitor deterioration in service.
        data_tests:
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 0
                max_value: 1
      - name: avg_delivery_minutes
        description: >
          Average delivery duration in minutes for deliveries in the hour and city.
          Sensitive to outliers, so pair with the percentile columns for ops review.
        data_tests:
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 0
      - name: p95_delivery_minutes
        description: >
          95th percentile delivery duration in minutes for the hour and city.
          Good leading indicator of tail-latency issues that averages can hide.
        data_tests:
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 0


  - name: fct_delivery_sla
    description: >
      Daily SLA summary by city used for operational monitoring and trend
      analysis.

      Grain: one row per (delivery_date, city_id).
    columns:
      - name: delivery_date
        description: Calendar date for the SLA aggregation.
        data_tests:
          - not_null
      - name: city_id
        description: Foreign key to the city for the SLA aggregation.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_cities')
                field: city_id
      - name: total_deliveries
        description: Total deliveries counted for the date and city.
        data_tests:
          - not_null
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 0
      - name: successful_deliveries
        description: Deliveries completed successfully.
        data_tests:
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 0
      - name: failed_deliveries
        description: Deliveries that did not complete successfully.
        data_tests:
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 0
      - name: on_time_delivery_rate
        description: Share of deliveries completed within the SLA threshold.
        data_tests:
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 0
                max_value: 1
      - name: sla_breach_rate
        description: Share of deliveries that breached the SLA threshold.
        data_tests:
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 0
                max_value: 1
      - name: avg_delivery_minutes
        description: Average delivery duration in minutes.
      - name: p95_delivery_minutes
        description: 95th percentile delivery duration in minutes.

  - name: dim_delivery_partners
    description: >
      Delivery partner dimension with lifetime profile attributes and rolling
      30-day performance metrics.

      Includes both active and inactive partners so historical deliveries retain
      valid foreign key coverage.

      Grain: one row per delivery_partner_id.
    config:
      contract:
        enforced: true
    columns:
      - name: delivery_partner_key
        data_type: varchar
        description: Surrogate key generated from delivery_partner_id.
        data_tests:
          - not_null
          - unique
      - name: delivery_partner_id
        data_type: varchar
        description: Natural delivery partner identifier.
        data_tests:
          - not_null
          - unique
      - name: partner_name
        data_type: varchar
        description: Delivery partner display name.
      - name: vehicle_type
        data_type: varchar
        description: Vehicle used by the delivery partner.
      - name: is_verified
        data_type: boolean
        description: Whether the partner has completed verification checks.
      - name: is_active
        data_type: boolean
        description: Whether the partner is currently active and eligible for assignments.
      - name: home_city_id
        data_type: varchar
        description: Foreign key to the partner's home city.
      - name: home_city_name
        data_type: varchar
        description: Denormalized name of the partner's home city.
      - name: total_deliveries_completed
        data_type: number(38, 0)
        description: Lifetime deliveries completed by the partner.
      - name: lifetime_avg_rating
        data_type: float
        description: Lifetime average rating for the partner.
      - name: lifetime_acceptance_rate
        data_type: float
        description: Lifetime acceptance rate for deliveries offered.
      - name: deliveries_last_30d
        data_type: number(38, 0)
        description: Number of deliveries completed in the trailing 30 days.
      - name: on_time_rate_last_30d
        data_type: number(38, 6)
        description: Trailing 30-day on-time delivery rate.
      - name: avg_delivery_minutes_last_30d
        data_type: number(38, 6)
        description: Trailing 30-day average delivery duration in minutes.

      - name: onboarded_at
        data_type: timestamp_ntz
        description: Timestamp when the partner was onboarded.
      - name: _dbt_loaded_at
        data_type: timestamp_ntz
        description: Timestamp when this mart row was loaded by dbt.
      - name: _dbt_invocation_id
        data_type: varchar
        description: dbt invocation identifier for the run that produced this row.
      - name: _dbt_run_started_at
        data_type: timestamp_ntz
        description: Timestamp when the dbt run that built this row started.
      - name: _dbt_model_id
        data_type: varchar
        description: Internal dbt model identifier for lineage and auditing.
      - name: src_load_dts
        data_type: timestamp_ntz
        description: Source load timestamp propagated into the mart for auditing.
      - name: src_filename
        data_type: varchar
        description: Source relation name recorded for lineage tracing.
      - name: src_record_source
        data_type: varchar
        description: Source-system identifier describing where the record originated.
      - name: src_batch_id
        data_type: varchar
        description: Batch identifier associated with the source ingestion event.
      - name: src_hash
        data_type: varchar
        description: Row-level hash used to detect source record changes.


  - name: fct_delivery_service_levels_py
    description: >
      Python-built delivery partner service-level aggregate by day and city.
      Useful for courier performance management and intervention workflows.

      Grain: one row per (delivery_date, city_id, delivery_partner_id).
    semantic_model:
      enabled: true
      name: delivery_service_levels
    agg_time_dimension: delivery_date
    metrics:
      - name: delivery_service_total
        description: Total deliveries in the Python service-level mart.
        label: Delivery Service Total
        type: simple
        agg: sum
        expr: total_deliveries
      - name: successful_deliveries_py
        description: Successful deliveries in the Python service-level mart.
        label: Successful Deliveries (Python)
        type: simple
        agg: sum
        expr: successful_deliveries
      - name: on_time_deliveries_py
        description: On-time deliveries in the Python service-level mart.
        label: On-Time Deliveries (Python)
        type: simple
        agg: sum
        expr: on_time_deliveries
    columns:
      - name: delivery_date
        description: Calendar date of the service-level slice.
        granularity: day
        dimension:
          type: time
          name: delivery_date
        data_tests:
          - not_null
      - name: city_id
        description: Foreign key to the city.
        entity:
          type: foreign
          name: city
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_cities')
                field: city_id
      - name: delivery_partner_id
        description: Foreign key to the delivery partner.
        entity:
          type: primary
          name: delivery_partner_day
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_delivery_partners')
                field: delivery_partner_id
      - name: service_level_band
        description: Performance bucket derived from on-time rate.
        dimension:
          type: categorical
        data_tests:
          - accepted_values:
              arguments:
                values: ['elite', 'strong', 'watch', 'critical']
      - name: speed_band
        description: Delivery speed bucket derived from average delivery minutes.
        dimension:
          type: categorical
        data_tests:
          - accepted_values:
              arguments:
                values: ['fast', 'standard', 'slow', 'severely_slow']
      - name: total_deliveries
        description: Total deliveries counted for the day/city/partner slice.
        data_tests:
          - not_null
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 0
      - name: successful_deliveries
        description: Successfully completed deliveries for the day/city/partner slice.
      - name: on_time_deliveries
        description: Deliveries completed within SLA for the day/city/partner slice.
      - name: avg_delivery_minutes
        description: Average delivery duration in minutes for the day/city/partner slice.
      - name: on_time_rate
        description: Share of deliveries in the slice that were completed within SLA.
