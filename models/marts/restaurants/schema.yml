version: 2

models:
  - name: dim_restaurants
    description: >
      Current-state restaurant dimension sourced from the restaurant snapshot and
      enriched with recent commercial and operational performance metrics.

      Grain: one row per restaurant_id.
    config:
      contract:
        enforced: true
    columns:
      - name: restaurant_key
        data_type: varchar
        description: Surrogate key generated from restaurant_id.
        data_tests:
          - not_null
          - unique
      - name: restaurant_id
        data_type: varchar
        description: Natural restaurant identifier.
        data_tests:
          - not_null
          - unique
      - name: restaurant_name
        data_type: varchar
        description: Restaurant display name.
      - name: cuisine_type
        data_type: varchar
        description: Primary cuisine classification for the restaurant.
      - name: restaurant_tier
        data_type: varchar
        description: Commercial tier assigned to the restaurant.
      - name: is_active
        data_type: boolean
        description: Whether the restaurant is currently active on the platform.
      - name: is_verified
        data_type: boolean
        description: Whether the restaurant has completed platform verification checks.
      - name: is_purely_vegetarian
        data_type: boolean
        description: Whether the restaurant is flagged as fully vegetarian.
      - name: city_id
        data_type: varchar
        description: Foreign key to the restaurant city.
        data_tests:
          - relationships:
              arguments:
                to: ref('stg_cities')
                field: city_id
      - name: city_name
        data_type: varchar
        description: Denormalized city name for the restaurant.
      - name: city_tier
        data_type: varchar
        description: Denormalized city tier used for geographic segmentation.
      - name: average_prep_time_minutes
        data_type: number(38, 0)
        description: Typical preparation time in minutes for orders from the restaurant.
      - name: minimum_order_amount
        data_type: number(38, 6)
        description: Minimum basket value required to place an order with the restaurant.
      - name: average_cost_for_two
        data_type: number(38, 6)
        description: Average check size for two diners used for restaurant pricing comparisons.
      - name: commission_rate
        data_type: float
        description: Current commission rate applied to orders from the restaurant.
        data_tests:
          - not_negative

      - name: orders_last_30d
        data_type: number(38, 0)
        description: Rolling 30-day order count for the restaurant.
      - name: revenue_last_30d
        data_type: number(38, 6)
        description: Rolling 30-day gross revenue generated by the restaurant.
      - name: avg_rating_last_30d
        data_type: float
        description: Rolling 30-day average customer rating.
      - name: avg_prep_minutes_last_30d
        data_type: number(38, 6)
        description: Rolling 30-day average preparation time in minutes.
      - name: on_time_rate_last_30d
        data_type: number(38, 6)
        description: Rolling 30-day share of delivered orders completed within SLA.

      - name: is_high_rated
        data_type: boolean
        description: Flag for restaurants with rolling 30-day rating of at least 4.2.
      - name: created_at
        data_type: timestamp_ntz
        description: Restaurant onboarding timestamp.
        data_tests:
          - not_null
      - name: dbt_scd_id
        data_type: varchar
        description: dbt-generated SCD identifier for the current snapshot row.
      - name: dbt_updated_at
        data_type: timestamp_ntz
        description: Snapshot update timestamp tracked by dbt.
      - name: _dbt_loaded_at
        data_type: timestamp_ntz
        description: Timestamp when this mart row was loaded by dbt.
      - name: _dbt_invocation_id
        data_type: varchar
        description: dbt invocation identifier for the run that produced this row.
      - name: _dbt_run_started_at
        data_type: timestamp_ntz
        description: Timestamp when the dbt run that built this row started.
      - name: _dbt_model_id
        data_type: varchar
        description: Internal dbt model identifier for lineage and auditing.
      - name: src_load_dts
        data_type: timestamp_ntz
        description: Source load timestamp propagated into the mart for auditing.
      - name: src_filename
        data_type: varchar
        description: Source relation name recorded for lineage tracing.
      - name: src_record_source
        data_type: varchar
        description: Source-system identifier describing where the record originated.
      - name: src_batch_id
        data_type: varchar
        description: Batch identifier associated with the source ingestion event.
      - name: src_hash
        data_type: varchar
        description: Row-level hash used to detect source record changes.


  - name: fct_restaurant_revenue
    description: >
      Restaurant daily revenue fact table used for marketplace performance,
      operational health, and partner management analytics.

      Grain: one row per (order_date, restaurant_id).
    columns:
      - name: order_date
        description: Calendar date for the daily restaurant aggregation.
        data_tests:
          - not_null
      - name: restaurant_id
        description: Natural restaurant identifier.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_restaurants')
                field: restaurant_id
      - name: restaurant_name
        description: Restaurant display name denormalized for analytics.
      - name: cuisine_type
        description: Primary cuisine classification.
      - name: city_id
        description: Foreign key to the restaurant city.
        data_tests:
          - relationships:
              arguments:
                to: ref('stg_cities')
                field: city_id
      - name: total_orders
        description: Total orders for the restaurant on the given date.
        data_tests:
          - not_null
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 0
      - name: unique_customers
        description: Distinct customers ordering from the restaurant on the given date.
        data_tests:
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 0
      - name: gross_revenue
        description: Gross revenue generated by the restaurant on the given date.
        data_tests:
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 0
      - name: platform_commission_earned
        description: Platform commission earned from the restaurant on the given date.
        data_tests:
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 0
      - name: restaurant_net_revenue
        description: Gross revenue less platform commission for the given date.
      - name: daily_avg_rating
        description: Average rating received by the restaurant for the given date.
        data_tests:
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 0
                max_value: 5
      - name: on_time_rate
        description: Share of orders delivered within SLA for the given date.
        data_tests:
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 0
                max_value: 1


  - name: dim_restaurant_health_py
    description: >
      Python-built restaurant health model that scores each restaurant using
      rolling operational and commercial signals from the current-state dimension.

      Grain: one row per restaurant_id.
    semantic_model:
      enabled: true
      name: restaurant_health
    agg_time_dimension: created_at
    metrics:
      - name: restaurant_count
        description: Count of restaurants represented in the Python restaurant health mart.
        label: Restaurant Count
        type: simple
        agg: count_distinct
        expr: restaurant_id
      - name: restaurant_health_score_total
        description: Sum of restaurant health scores.
        label: Restaurant Health Score Total
        type: simple
        agg: sum
        expr: health_score
      - name: restaurants_needing_attention
        description: Count of restaurants flagged as needing attention.
        label: Restaurants Needing Attention
        type: simple
        agg: sum_boolean
        expr: needs_attention
    columns:
      - name: restaurant_id
        description: Natural restaurant identifier.
        entity:
          type: primary
          name: restaurant
        data_tests:
          - not_null
          - unique
          - relationships:
              arguments:
                to: ref('dim_restaurants')
                field: restaurant_id
      - name: city_id
        description: City identifier for the restaurant.
        entity:
          type: foreign
          name: city
      - name: cuisine_type
        description: Cuisine classification.
        dimension:
          type: categorical
      - name: restaurant_tier
        description: Restaurant commercial tier.
        dimension:
          type: categorical
      - name: created_at
        description: Record timestamp carried from the underlying restaurant dimension.
        granularity: day
        dimension:
          type: time
          name: created_at
      - name: health_score
        description: Composite health score on a 0-100 scale.
        data_tests:
          - not_null
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 0
                max_value: 100
      - name: health_tier
        description: Health classification bucket.
        dimension:
          type: categorical
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['excellent', 'healthy', 'watchlist', 'critical']
      - name: needs_attention
        description: Whether the restaurant should be flagged for operational or commercial follow-up.
        data_tests:
          - not_null
      - name: orders_last_30d
        description: Rolling 30-day order count used in the health score calculation.
      - name: revenue_last_30d
        description: Rolling 30-day revenue used in the health score calculation.
      - name: avg_rating_last_30d
        description: Rolling 30-day average rating used in the health score calculation.
      - name: on_time_rate_last_30d
        description: Rolling 30-day on-time delivery rate used in the health score calculation.
