version: 2

models:
  - name: fct_revenue
    description: >
      Primary financial fact table. One row per order with all revenue components.
      This is the source of truth for GMV, net revenue, platform commission,
      and delivery fee revenue calculations.

      Grain: one row per order_id.
      Incremental strategy: microbatch on ordered_at with daily batches and a
      one-batch lookback for late-arriving records.
      Cluster key: ordered_at::date, city_id — aligns with common BI query patterns.

    semantic_model:
      enabled: true
      name: orders

    agg_time_dimension: order_date

    config:
      contract:
        enforced: true

    columns:
      - name: order_id
        data_type: varchar
        description: Natural primary key from the Orders API.
        entity:
          type: primary
          name: order
        data_tests:
          - not_null
          - unique

      - name: customer_id
        data_type: varchar
        description: Foreign key to the customer associated with the order.
        entity:
          type: foreign
          name: customer
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_customers')
                field: customer_id


      - name: restaurant_id
        data_type: varchar
        description: Foreign key to the restaurant fulfilling the order.
        entity:
          type: foreign
          name: restaurant
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_restaurants')
                field: restaurant_id

      - name: delivery_partner_id
        data_type: varchar
        description: Foreign key to the delivery partner assigned to the order.
      - name: city_id
        data_type: varchar
        description: Foreign key to the order city.
        entity:
          type: foreign
          name: city
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_cities')
                field: city_id
      - name: promo_id
        data_type: varchar
        description: Foreign key to the promotion applied to the order, when present.

      - name: city_name
        data_type: varchar
        description: Denormalized city name for reporting.
        dimension:
          type: categorical
      - name: city_tier
        data_type: varchar
        description: Denormalized city tier for segmentation.
        dimension:
          type: categorical
        data_tests:
          - accepted_values:
              arguments:
                values: ['tier_1', 'tier_2', 'tier_3']
      - name: is_metro
        data_type: boolean
        description: Whether the order city is classified as a metro market.
      - name: cuisine_type
        data_type: varchar
        description: Cuisine classification associated with the fulfilling restaurant.
        dimension:
          type: categorical
      - name: restaurant_tier
        data_type: varchar
        description: Commercial tier of the restaurant at the time of the order.
        dimension:
          type: categorical
      - name: customer_segment
        data_type: varchar
        description: Customer segment at the time of the order.
        dimension:
          type: categorical
        data_tests:
          - accepted_values:
              arguments:
                values: ['premium', 'regular', 'occasional', 'new']
      - name: acquisition_channel
        data_type: varchar
        description: First-touch acquisition channel associated with the customer on the order.

      - name: order_status
        data_type: varchar
        description: Final order lifecycle status used for finance reporting.
        dimension:
          type: categorical
        data_tests:
          - accepted_values:
              arguments:
                values: ['pending', 'accepted', 'preparing', 'out_for_delivery', 'delivered', 'cancelled', 'refunded', 'test_order']
      - name: cancellation_reason
        data_type: varchar
        description: Cancellation reason recorded for cancelled or refunded orders.
      - name: is_on_time_delivery
        data_type: boolean
        description: Whether the order was delivered within the SLA threshold.
        dimension:
          type: categorical
      - name: is_sla_breach
        data_type: boolean
        description: Whether the order breached the delivery SLA threshold.

      - name: subtotal_amount
        data_type: number(38, 6)
        description: Basket subtotal before fees, taxes, and discounts.
      - name: delivery_fee
        data_type: number(38, 6)
        description: Delivery fee charged to the customer.
      - name: platform_fee
        data_type: number(38, 6)
        description: Platform service fee charged to the customer.
      - name: gst_amount
        data_type: number(38, 6)
        description: GST component included in the order total.
      - name: promo_discount_amount
        data_type: number(38, 6)
        description: Discount amount applied to the order via promotions.
      - name: gross_revenue
        data_type: number(38, 6)
        description: >
          Total order value in rupees including all fees. Equal to total_amount
          from the source. This is the top-line GMV metric.
          Does NOT subtract promotional discounts (see net_revenue).
        data_tests:
          - not_null
          - not_negative
      - name: net_revenue
        data_type: number(38, 6)
        description: >
          gross_revenue minus promo_discount_amount. This is the revenue
          that flows to Zomato's P&L after absorbing platform-funded promotions.
          Note: restaurant-funded promos are NOT subtracted here
          (they appear in the restaurant's commission deduction).
        data_tests:
          - not_null
      - name: platform_commission
        data_type: number(38, 6)
        description: >
          Zomato's commission earned from the restaurant for this order.
          Calculated as total_amount × restaurant.commission_rate.
          Commission rate varies by restaurant tier (18-25%).
        data_tests:
          - not_null
          - not_negative
      - name: delivery_fee_revenue
        data_type: number(38, 6)
        description: Delivery fee revenue recognized from the order.

      - name: total_items
        data_type: number(38, 0)
        description: Total number of item units included in the order.
      - name: distinct_item_categories
        data_type: number(38, 0)
        description: Count of distinct menu item categories represented in the order.


      - name: payment_method
        data_type: varchar
        description: Payment method used on the order.
        dimension:
          type: categorical
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_payment_methods')
                field: payment_method
      - name: is_reconciled
        data_type: boolean
        description: Whether payment and order amounts reconcile within tolerance.
      - name: paid_at
        data_type: timestamp_ntz
        description: Timestamp when the payment was recorded as paid.

      - name: order_date
        data_type: date
        description: Calendar date of the order (ordered_at truncated to date).
        granularity: day
        dimension:
          type: time
          name: order_date
        data_tests:
          - not_null
      - name: order_week
        data_type: date
        description: Week bucket for the order date.
      - name: order_month
        data_type: date
        description: Month bucket for the order date.
        granularity: month
        dimension:
          type: time
          name: order_month
      - name: day_of_week_num
        data_type: number(38, 0)
        description: Numeric day of week for the order date.
      - name: order_hour
        data_type: number(38, 0)
        description: Hour of day when the order was placed.

      - name: is_weekend_order
        data_type: boolean
        description: Whether the order was placed on a weekend.
        dimension:
          type: categorical

      - name: ordered_at
        data_type: timestamp_ntz
        description: Timestamp when the customer placed the order.
      - name: delivered_at
        data_type: timestamp_ntz
        description: Timestamp when the order was delivered to the customer.
      - name: total_delivery_minutes
        data_type: number(38, 0)
        description: End-to-end delivery duration in minutes for delivered orders.

      - name: updated_at
        data_type: timestamp_ntz
        description: Source-system last update timestamp for the order.

      - name: _dbt_loaded_at
        data_type: timestamp_ntz
        description: Timestamp when this mart row was loaded by dbt.
      - name: _dbt_invocation_id
        data_type: varchar
        description: dbt invocation identifier for the run that produced this row.
      - name: _dbt_run_started_at
        data_type: timestamp_ntz
        description: Timestamp when the dbt run that built this row started.
      - name: _dbt_model_id
        data_type: varchar
        description: Internal dbt model identifier for lineage and auditing.
      - name: src_load_dts
        data_type: timestamp_ntz
        description: Source load timestamp propagated into the mart for auditing.
      - name: src_filename
        data_type: varchar
        description: Source relation name recorded for lineage tracing.
      - name: src_record_source
        data_type: varchar
        description: Source-system identifier describing where the record originated.
      - name: src_batch_id
        data_type: varchar
        description: Batch identifier associated with the source ingestion event.
      - name: src_hash
        data_type: varchar
        description: Row-level hash used to detect source record changes.


    metrics:
      - name: order_count
        description: Count of all orders placed.
        label: Order Count
        type: simple
        agg: count_distinct
        expr: order_id

      - name: gross_revenue
        description: Total order value before deductions.
        label: Gross Revenue
        type: simple
        agg: sum
        expr: gross_revenue

      - name: net_revenue
        description: Revenue after discounts and other deductions captured in the model.
        label: Net Revenue Base
        type: simple
        agg: sum
        expr: net_revenue

      - name: platform_commission
        description: Total platform commission earned on orders.
        label: Platform Commission
        type: simple
        agg: sum
        expr: platform_commission

      - name: promo_discount_amount
        description: Total promotional discounts applied to orders.
        label: Promo Discount Amount
        type: simple
        agg: sum
        expr: promo_discount_amount

      - name: delivery_fee_total
        description: Total delivery fee revenue from orders.
        label: Delivery Fee Total
        type: simple
        agg: sum
        expr: delivery_fee_revenue

      - name: delivered_order_count
        description: Count of delivered orders only.
        label: Delivered Order Count
        type: simple
        agg: count_distinct
        expr: order_id
        filter: "{{ Dimension('order__order_status') }} = 'delivered'"






  - name: fct_refunds
    description: >
      Refunded orders with all financial context. One row per refunded order.
      Used by Finance team for daily refund reconciliation and refund rate KPI.

      Grain: one row per (refund_date, order_id).
      Incremental strategy: delete+insert by refund_date. Reprocesses last 7 days.

    columns:
      - name: refund_date
        description: Calendar date of the refund (order_date for the cancelled order).
        data_tests:
          - not_null
      - name: order_id
        description: Natural key of the refunded order.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('fct_revenue')
                field: order_id
      - name: refunded_amount
        description: Full order total refunded to the customer in rupees.
        data_tests:
          - not_null
          - not_negative

      - name: customer_id
        description: Foreign key to the refunded order's customer.
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_customers')
                field: customer_id
      - name: restaurant_id
        description: Foreign key to the refunded order's restaurant.
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_restaurants')
                field: restaurant_id
      - name: city_id
        description: Foreign key to the refunded order's city.
        data_tests:
          - relationships:
              arguments:
                to: ref('stg_cities')
                field: city_id
      - name: payment_method
        description: Payment method used on the refunded transaction.
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_payment_methods')
                field: payment_method


  - name: dim_payment_methods
    description: >
      Reference dimension for payment methods. One row per payment method.
      Contains human-readable labels, groupings, and derived fee rates.

      Rebuilt fully on every run (< 20 rows, negligible cost).
      Use payment_method_key as the join key in BI tools.

    columns:
      - name: payment_method_key
        description: MD5 surrogate key generated from payment_method string.
        data_tests:
          - not_null
          - unique
      - name: payment_method
        description: Natural key matching payment_method in fct_revenue and fct_payments.
        data_tests:
          - not_null
          - unique
      - name: payment_method_group
        description: High-level grouping (digital, card, cash, credit).
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['digital', 'card', 'cash', 'credit', 'other']

  - name: fct_payments_history
    description: >
      Historical payment-state fact built from the raw-ingestion payment snapshot.
      One row per payment_id version, with dbt snapshot validity windows for point-in-time
      analysis and backfill-friendly lifecycle tracking.

      Grain: one row per (payment_id, dbt_valid_from).
    columns:
      - name: payment_id
        description: Natural payment identifier.
        data_tests:
          - not_null
      - name: order_id
        description: Order associated with the payment attempt.
        data_tests:
          - not_null
      - name: payment_status
        description: Payment lifecycle status for this historical version.
        data_tests:
          - not_null
      - name: payment_method
        description: Payment method recorded for this historical version.
      - name: payment_amount
        description: Gross payment amount in rupees for this version.
      - name: gateway_fee
        description: Gateway fee in rupees for this version.
      - name: net_amount
        description: Net payment amount after gateway fees for this version.
      - name: paid_at
        description: Timestamp when the payment was recorded as paid.
      - name: settlement_date
        description: Date the payment settled with the gateway.
      - name: _loaded_at
        description: Raw ingestion timestamp from the landed payment source.
      - name: dbt_valid_from
        description: Snapshot validity start timestamp for this payment version.
        data_tests:
          - not_null
      - name: dbt_valid_to
        description: Snapshot validity end timestamp for this payment version.
        data_tests:
          - not_null
      - name: dbt_updated_at
        description: Snapshot updated timestamp derived from the raw ingestion timestamp.
      - name: dbt_scd_id
        description: dbt-generated surrogate identifier for the snapshot version.
        data_tests:
          - not_null
      - name: is_current_record
        description: True when this is the current active version of the payment row.
        data_tests:
          - not_null
      - name: valid_from_date
        description: Date projection of dbt_valid_from for date-based joins.
      - name: valid_to_date
        description: Date projection of dbt_valid_to for date-based joins.

