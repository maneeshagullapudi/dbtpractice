version: 2

models:
  - name: dim_customers
    description: >
      Current-state customer dimension sourced from the customer snapshot and
      enriched with behavioral attributes from order history.

      Grain: one row per customer_id.
    config:
      contract:
        enforced: true
    columns:
      - name: customer_key
        data_type: varchar
        description: Surrogate key generated from customer_id.
        data_tests:
          - not_null
          - unique
      - name: customer_id
        data_type: varchar
        description: Natural customer identifier from the source platform.
        data_tests:
          - not_null
          - unique
      - name: customer_name
        data_type: varchar
        description: Customer display name with environment-appropriate masking preserved from staging.
      - name: customer_email
        data_type: varchar
        description: Customer email with environment-appropriate masking preserved from staging.
      - name: customer_phone
        data_type: varchar
        description: Customer phone number with environment-appropriate masking preserved from staging.
      - name: city_id
        data_type: varchar
        description: Foreign key to the customer city.
        data_tests:
          - relationships:
              arguments:
                to: ref('stg_cities')
                field: city_id
      - name: acquisition_channel
        data_type: varchar
        description: First-touch acquisition channel for the customer.
        data_tests:
          - accepted_values:
              arguments:
                values: ['organic', 'paid_social', 'referral', 'promo', 'app_store', 'unknown']
      - name: customer_segment
        data_type: varchar
        description: Current CRM-defined customer segment.
        data_tests:
          - accepted_values:
              arguments:
                values: ['premium', 'regular', 'occasional', 'new']
      - name: is_active
        data_type: boolean
      - name: is_pro_subscriber
        data_type: boolean
      - name: first_order_date
        data_type: date
      - name: first_order_month
        data_type: date
      - name: last_order_date
        data_type: date
      - name: days_since_last_order
        data_type: number(38, 0)
      - name: total_orders
        data_type: number(38, 0)
        description: Lifetime delivered and refunded order count used for customer analytics.
      - name: lifetime_gross_revenue
        data_type: number(38, 6)
        description: Lifetime gross revenue attributed to the customer.
      - name: average_order_value
        data_type: number(38, 6)
      - name: churn_risk_tier
        data_type: varchar
        description: Derived churn-risk classification from recent order behavior.
        data_tests:
          - accepted_values:
              arguments:
                values: ['high', 'medium', 'low']
      - name: is_active_30d
        data_type: boolean
      - name: is_active_60d
        data_type: boolean
      - name: distinct_cuisines_ordered
        data_type: number(38, 0)
      - name: distinct_restaurants_ordered
        data_type: number(38, 0)
      - name: created_at
        data_type: timestamp_ntz
        description: Customer account creation timestamp.
        data_tests:
          - not_null
      - name: dbt_scd_id
        data_type: varchar
      - name: dbt_updated_at
        data_type: timestamp_ntz
      - name: _dbt_loaded_at
        data_type: timestamp_ntz
      - name: _dbt_invocation_id
        data_type: varchar
      - name: _dbt_run_started_at
        data_type: timestamp_ntz
      - name: _dbt_model_id
        data_type: varchar
      - name: src_load_dts
        data_type: timestamp_ntz
      - name: src_filename
        data_type: varchar
      - name: src_record_source
        data_type: varchar
      - name: src_batch_id
        data_type: varchar
      - name: src_hash
        data_type: varchar


  - name: fct_customer_orders
    description: >
      Customer-centric order fact table optimized for retention, cohort, and
      repeat-order analysis.

      Grain: one row per order_id.
    config:
      contract:
        enforced: true
    columns:
      - name: order_id
        data_type: varchar
        description: Natural order identifier.
        data_tests:
          - not_null
          - unique
      - name: customer_id
        data_type: varchar
        description: Foreign key to the customer who placed the order.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_customers')
                field: customer_id
      - name: customer_segment
        data_type: varchar
        description: Customer segment at the time the order was modeled.
      - name: acquisition_channel
        data_type: varchar
        description: Acquisition channel carried through for cohort analysis.
      - name: is_pro_subscriber
        data_type: boolean
        description: Whether the customer was a Pro subscriber at the time of the order.
      - name: first_order_date
        data_type: date
        description: Date of the customer's first delivered or refunded order.
      - name: first_order_month
        data_type: date
        description: Month bucket of the customer's first delivered or refunded order.
      - name: days_since_first_order
        data_type: number
        description: Days elapsed between the first order and this order.
      - name: months_since_acquisition
        data_type: number
        description: Whole months elapsed since the customer acquisition month.
      - name: customer_order_number
        data_type: number
        description: Sequential order number for the customer based on ordered_at.
        data_tests:
          - not_null
      - name: city_id
        data_type: varchar
        description: Foreign key to the city where the order was placed.
      - name: city_name
        data_type: varchar
        description: Denormalized city name for customer order analysis.
      - name: city_tier
        data_type: varchar
        description: Denormalized city tier for customer cohort segmentation.
      - name: restaurant_id
        data_type: varchar
        description: Foreign key to the restaurant fulfilling the order.
      - name: cuisine_type
        data_type: varchar
        description: Cuisine classification associated with the fulfilling restaurant.
      - name: restaurant_tier
        data_type: varchar
        description: Commercial tier of the fulfilling restaurant.
      - name: order_status
        data_type: varchar
        description: Order lifecycle status.
        data_tests:
          - accepted_values:
              arguments:
                values: ['delivered', 'cancelled', 'refunded']
      - name: total_amount
        data_type: number(38, 6)
        description: Final order amount charged to the customer.
      - name: promo_discount_amount
        data_type: number(38, 6)
        description: Promotional discount amount applied to the order.
      - name: total_items
        data_type: number(38, 0)
        description: Total number of item units included in the order.

      - name: ordered_at
        data_type: timestamp_ntz
        description: Timestamp when the customer placed the order.
      - name: delivered_at
        data_type: timestamp_ntz
        description: Timestamp when the order was delivered to the customer.
      - name: order_date
        data_type: date
        description: Calendar date of the order.
        data_tests:
          - not_null
      - name: order_month
        data_type: date
        description: Month bucket for the order date.
      - name: is_weekend_order
        data_type: boolean
        description: Whether the order was placed on a weekend.
      - name: total_delivery_minutes
        data_type: number(38, 0)
        description: End-to-end delivery duration in minutes for the order.

      - name: updated_at
        data_type: timestamp_ntz
        description: Source-system last update timestamp used as the incremental watermark.
        data_tests:
          - not_null
      - name: _dbt_loaded_at
        data_type: timestamp_ntz
        description: Timestamp when this mart row was loaded by dbt.
      - name: _dbt_invocation_id
        data_type: varchar
        description: dbt invocation identifier for the run that produced this row.
      - name: _dbt_run_started_at
        data_type: timestamp_ntz
        description: Timestamp when the dbt run that built this row started.
      - name: _dbt_model_id
        data_type: varchar
        description: Internal dbt model identifier for lineage and auditing.
      - name: src_load_dts
        data_type: timestamp_ntz
        description: Source load timestamp propagated into the mart for auditing.
      - name: src_filename
        data_type: varchar
        description: Source relation name recorded for lineage tracing.
      - name: src_record_source
        data_type: varchar
        description: Source-system identifier describing where the record originated.
      - name: src_batch_id
        data_type: varchar
        description: Batch identifier associated with the source ingestion event.
      - name: src_hash
        data_type: varchar
        description: Row-level hash used to detect source record changes.



  - name: fct_customer_lifetime_value
    description: >
      Customer lifetime value model that combines realized revenue with a simple
      forward-looking estimate for prioritization and segmentation.

      Grain: one row per customer_id.
    columns:
      - name: customer_key
        description: Surrogate key generated from customer_id.
        data_tests:
          - not_null
          - unique
      - name: customer_id
        description: Natural customer identifier.
        data_tests:
          - not_null
          - unique
          - relationships:
              arguments:
                to: ref('dim_customers')
                field: customer_id
      - name: realized_ltv
        description: Historical realized lifetime gross revenue for the customer.
        data_tests:
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 0
      - name: predicted_future_ltv
        description: Simplified estimate of future lifetime value based on order behavior.
        data_tests:
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 0
      - name: total_predicted_ltv
        description: Sum of realized_ltv and predicted_future_ltv.
        data_tests:
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 0
      - name: monthly_order_rate
        description: Historical monthly order frequency used in the predictive estimate.
        data_tests:
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 0
      - name: expected_remaining_active_months
        description: Heuristic estimate of remaining active months.
      - name: ltv_tier
        description: Bucketed customer value segment derived from total_predicted_ltv.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['platinum', 'gold', 'silver', 'bronze']
      - name: first_order_date
        description: Date of the customer's first delivered or refunded order.
      - name: last_order_date
        description: Date of the customer's most recent delivered or refunded order.


  - name: dim_customer_features_py
    description: >
      Python feature mart for customer segmentation use cases. Extends the base
      customer dimension with recency, frequency, LTV, and engagement bands.

      Grain: one row per customer_id.
    semantic_model:
      enabled: true
      name: customer_features
    agg_time_dimension: last_order_date
    metrics:
      - name: customer_feature_rows
        description: Count of customers represented in the Python feature mart.
        label: Customer Feature Rows
        type: simple
        agg: count_distinct
        expr: customer_id
      - name: customer_engagement_score_total
        description: Sum of engagement scores across customers.
        label: Customer Engagement Score Total
        type: simple
        agg: sum
        expr: engagement_score
    columns:
      - name: customer_id
        description: Natural customer identifier.
        entity:
          type: primary
          name: customer
        data_tests:
          - not_null
          - unique
          - relationships:
              arguments:
                to: ref('dim_customers')
                field: customer_id
      - name: city_id
        description: Foreign key to the customer city.
        entity:
          type: foreign
          name: city
      - name: customer_segment
        description: Customer segment for feature slicing.
        dimension:
          type: categorical
      - name: churn_risk_tier
        description: Churn-risk bucket from the underlying customer dimension.
        dimension:
          type: categorical
      - name: last_order_date
        description: Date of the customer's most recent order.
        granularity: day
        dimension:
          type: time
          name: last_order_date
      - name: recency_bucket
        description: Recency classification based on days since last order.
        dimension:
          type: categorical
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['active_7d', 'active_30d', 'active_90d', 'dormant']
      - name: frequency_band
        description: Frequency classification derived from monthly order rate.
        dimension:
          type: categorical
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['power', 'core', 'casual', 'rare']
      - name: ltv_band
        description: Value band derived from total predicted LTV.
        dimension:
          type: categorical
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['platinum', 'gold', 'silver', 'bronze']
      - name: engagement_score
        description: Composite engagement score on a 0-100 scale.
        data_tests:
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 0
                max_value: 100

  - name: fct_customer_retention_py

    description: >
      Python-built monthly customer retention aggregate by acquisition channel.
      Useful for quick retention and repeat-rate trend analysis.

      Grain: one row per (order_month, acquisition_channel).
    semantic_model:
      enabled: true
      name: customer_retention

    metrics:
      - name: active_customers_py
        description: Distinct active customers from the Python retention mart.
        label: Active Customers (Python)
        type: simple
        agg: sum
        expr: active_customers
      - name: repeat_customers_py
        description: Repeat customers from the Python retention mart.
        label: Repeat Customers (Python)
        type: simple
        agg: sum
        expr: repeat_customers
      - name: retained_customers_90d_py
        description: Customers retained within 90 days from the Python retention mart.
        label: Retained Customers 90D (Python)
        type: simple
        agg: sum
        expr: retained_within_90d_customers
    columns:
      - name: customer_retention_cohort_key
        description: Surrogate key for the monthly acquisition-channel cohort row.
        entity:
          type: primary
          name: customer_retention_cohort
      - name: order_month
        description: Month bucket for the retention aggregation.
        granularity: month
        dimension:
          type: time
          name: order_month
        data_tests:
          - not_null
      - name: acquisition_channel
        description: Acquisition channel of the customer cohort slice.
        dimension:
          type: categorical
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['organic', 'paid_social', 'referral', 'promo', 'app_store', 'unknown']
      - name: active_customers
        description: Distinct active customers in the month and channel.
        data_tests:
          - not_null
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 0
      - name: repeat_customer_rate
        description: Share of active customers who are repeat customers.
        data_tests:
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 0
                max_value: 1
      - name: retention_30d_rate
        description: Share of active customers retained within 30 days.
        data_tests:
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 0
                max_value: 1
      - name: retention_60d_rate
        description: Share of active customers retained within 60 days.
        data_tests:
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 0
                max_value: 1
      - name: retention_90d_rate
        description: Share of active customers retained within 90 days.
        data_tests:
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 0
                max_value: 1

