version: 2

models:
  - name: dim_dates
    description: >
      Date dimension table covering all dates in the platform's history and future
      planning horizon. Built from a date spine via the generate_date_spine() macro.

      Use this model as a LEFT JOIN anchor in any time-series report to ensure
      every date appears — even dates with zero orders, deliveries, or payments.

      Grain: one row per calendar date.
      Materialization: table (rebuilds fully on every run — deterministic, fast).
      Date range: configured via dbt vars (date_spine_start / date_spine_end).

    columns:
      - name: date_day
        description: Calendar date (the primary key of this dimension).
        data_tests:
          - not_null
          - unique

      - name: day_of_week_name
        description: Full day name in English (Monday, Tuesday, ..., Sunday).
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday', 'Sunday']

      - name: business_season
        description: >
          Zomato business season classification driven by Indian calendar events.
          festive_season: Oct-Nov (Navratri → Diwali, highest demand spike).
          new_year_season: Dec-Jan (Christmas → New Year).
          monsoon_season: Jun-Aug (lower demand due to weather).
          summer_season: Mar-Apr.
          regular: remaining months.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['festive_season', 'new_year_season', 'monsoon_season', 'summer_season', 'regular']


  - name: dim_dates_py
    description: >
      Python-built date dimension that mirrors the core calendar attributes from
      the SQL version and adds a string date key for tool compatibility.

      Grain: one row per calendar date.
    semantic_model:
      enabled: true
      name: calendar_days
    agg_time_dimension: date_day
    metrics:
      - name: calendar_day_count
        description: Count of calendar days in the Python date dimension.
        label: Calendar Day Count
        type: simple
        agg: count_distinct
        expr: date_key
    columns:
      - name: date_day
        description: Calendar date.
        granularity: day
        dimension:
          type: time
          name: date_day
        data_tests:
          - not_null
          - unique
      - name: date_key
        description: YYYYMMDD-formatted surrogate-friendly calendar key.
        entity:
          type: primary
          name: calendar_day
        data_tests:
          - not_null
          - unique
      - name: day_of_week_name
        description: Full day name in English.
        dimension:
          type: categorical
        data_tests:
          - accepted_values:
              arguments:
                values: ['Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday', 'Sunday']
      - name: business_season
        description: Business season classification.
        dimension:
          type: categorical
        data_tests:
          - accepted_values:
              arguments:
                values: ['festive_season', 'new_year_season', 'monsoon_season', 'summer_season', 'regular']
