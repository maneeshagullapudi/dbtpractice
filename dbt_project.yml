name: 'zomato_food_delivery'
version: '1.0.0'
config-version: 2

profile: 'zomato_food_delivery'
require-dbt-version: [">=1.10.0", "<2.1.0"]

dbt-cloud:
  project-id: 70506183140521

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]
docs-paths: ["docs"]
packages-install-path: "dbt_packages"

clean-targets:
  - "target"
  - "dbt_packages"

# Snowflake session tag on every dbt run — searchable in query history
on-run-start:
  - "ALTER SESSION SET QUERY_TAG = 'dbt_run_{{ invocation_id }}'"

on-run-end:
  - "ALTER SESSION SET QUERY_TAG = ''"

seeds:
  zomato_food_delivery:
    +schema: reference
    +quote_columns: false
    seed_city_tiers:
      +column_types:
        city_id: varchar
        city_name: varchar
        tier: varchar
        state: varchar
        is_metro: boolean
    seed_cuisine_categories:
      +column_types:
        cuisine_id: varchar
        cuisine_name: varchar
        cuisine_category: varchar
        is_premium: boolean

    # ── Raw source simulation seeds ───────────────────────────────────────────
    # Used with use_seed_data=true for local dev without real Snowflake sources.
    # Each seed mirrors the column structure of its source table.
    raw_customers:
      +schema: raw_zomato_customers
      +quote_columns: false
      +column_types:
        customer_id: varchar
        is_active: boolean
        is_pro_subscriber: boolean
        created_at: timestamp_ntz
        last_login_at: timestamp_ntz
        updated_at: timestamp_ntz
        _fivetran_synced: timestamp_ntz

    raw_restaurants:
      +schema: raw_zomato_restaurants
      +quote_columns: false
      +column_types:
        restaurant_id: varchar
        is_active: boolean
        is_verified: boolean
        is_purely_vegetarian: boolean
        average_prep_time_minutes: integer
        minimum_order_amount: number
        average_cost_for_two: number
        commission_rate: float
        overall_rating: float
        total_ratings_count: integer
        created_at: timestamp_ntz
        updated_at: timestamp_ntz
        _fivetran_synced: timestamp_ntz

    raw_menu_items:
      +schema: raw_zomato_restaurants
      +quote_columns: false
      +column_types:
        restaurant_id: varchar
        base_price: number
        is_vegetarian: boolean
        is_available: boolean
        _fivetran_synced: timestamp_ntz

    raw_orders:
      +schema: raw_zomato_transactional
      +quote_columns: false
      +column_types:
        subtotal_amount: number
        delivery_fee: number
        platform_fee: number
        promo_discount_amount: number
        tax_amount: number
        total_amount: number
        order_status: varchar
        cancellation_reason: varchar
        is_contactless_delivery: boolean
        ordered_at: timestamp_ntz
        accepted_at: timestamp_ntz
        prepared_at: timestamp_ntz
        picked_up_at: timestamp_ntz
        delivered_at: timestamp_ntz
        cancelled_at: timestamp_ntz
        updated_at: timestamp_ntz
        _fivetran_synced: timestamp_ntz

    raw_order_items:
      +schema: raw_zomato_transactional
      +quote_columns: false
      +column_types:
        quantity: integer
        unit_price: number
        item_subtotal: number
        customization_price_delta: number
        _fivetran_synced: timestamp_ntz
        created_at: timestamp_ntz

    raw_delivery_partners:
      +schema: raw_zomato_delivery
      +quote_columns: false
      +column_types:
        is_verified: boolean
        is_active: boolean
        total_deliveries_completed: integer
        average_rating: float
        acceptance_rate: float
        onboarded_at: timestamp_ntz
        updated_at: timestamp_ntz
        _fivetran_synced: timestamp_ntz

    raw_deliveries:
      +schema: raw_zomato_delivery
      +quote_columns: false
      +column_types:
        assigned_at: timestamp_ntz
        en_route_restaurant_at: timestamp_ntz
        arrived_restaurant_at: timestamp_ntz
        picked_up_at: timestamp_ntz
        delivered_at: timestamp_ntz
        delivery_distance_km: float
        route_distance_km: float
        updated_at: timestamp_ntz
        _fivetran_synced: timestamp_ntz

    raw_payments:
      +schema: raw_zomato_payments
      +quote_columns: false
      +column_types:
        payment_amount: number
        gateway_fee: number
        paid_at: timestamp_ntz
        _loaded_at: timestamp_ntz

    raw_ratings:
      +schema: raw_zomato_engagement
      +quote_columns: false
      +column_types:
        food_rating: integer
        delivery_rating: integer
        overall_rating: float
        rated_at: timestamp_ntz
        _airbyte_extracted_at: timestamp_ntz

    raw_promotions:
      +schema: raw_zomato_promotions
      +quote_columns: false
      +column_types:
        discount_value: number
        min_order_value: number
        max_redemptions: integer
        max_redemptions_per_customer: integer
        is_new_customer_only: boolean
        valid_from: date
        valid_to: date
        is_active: boolean
        updated_at: timestamp_ntz
        _fivetran_synced: timestamp_ntz

    raw_promo_redemptions:
      +schema: raw_zomato_promotions
      +quote_columns: false
      +column_types:
        discount_amount_applied: number
        redeemed_at: timestamp_ntz
        _fivetran_synced: timestamp_ntz

    raw_areas:
      +schema: raw_zomato_geography
      +quote_columns: false
      +column_types:
        _fivetran_synced: timestamp_ntz

    raw_support_tickets:
      +schema: raw_zomato_support
      +quote_columns: false
      +column_types:
        created_at: timestamp_ntz
        first_response_at: timestamp_ntz
        resolved_at: timestamp_ntz
        updated_at: timestamp_ntz
        _airbyte_extracted_at: timestamp_ntz

snapshots:
  zomato_food_delivery:
    +schema: snapshots

models:
  zomato_food_delivery:

    # All models get a query tag for Snowflake query history attribution
    +query_tag: 'dbt_zomato'

    staging:
      +materialized: view
      +schema: staging
      +tags: ['staging']
      +group: platform
      +access: protected

      orders:
        +tags: ['orders', 'transactional']
      customers:
        +tags: ['customers']
      restaurants:
        +tags: ['restaurants']
      delivery:
        +tags: ['delivery', 'operations']
      payments:
        +tags: ['payments', 'finance']
      engagement:
        +tags: ['engagement', 'ratings']
      promotions:
        +tags: ['promotions', 'marketing']
      geography:
        +tags: ['geography', 'reference']
      support:
        +tags: ['support', 'cx']

    intermediate:
      +materialized: ephemeral
      +schema: intermediate
      +tags: ['intermediate']
      +group: platform
      +access: protected

    marts:
      +materialized: table
      +tags: ['marts']

      finance:
        +schema: marts_finance
        +tags: ['finance']
        +group: finance
        +access: protected
        fct_revenue:
          +materialized: incremental
          +incremental_strategy: merge
          +unique_key: order_id
          +cluster_by: ['ordered_at::date', 'city_id']
          +on_schema_change: 'append_new_columns'
          +access: public
        fct_refunds:
          +materialized: incremental
          +incremental_strategy: delete+insert
          +unique_key: ['refund_date', 'order_id']
          +cluster_by: ['refund_date']
      customers:
        +schema: marts_customers
        +tags: ['customers']
        +group: customers
        +access: protected
        dim_customers:
          +access: public
        fct_customer_orders:
          +materialized: incremental
          +incremental_strategy: merge
          +unique_key: order_id
          +cluster_by: ['ordered_at::date']
          +access: public
        fct_customer_lifetime_value:
          +materialized: table
          +tags: ['weekly', 'slow']
      restaurants:
        +schema: marts_restaurants
        +tags: ['restaurants']
        +group: restaurants
        +access: protected
        dim_restaurants:
          +access: public
        fct_restaurant_revenue:
          +materialized: incremental
          +incremental_strategy: merge
          +unique_key: ['order_date', 'restaurant_id']
          +cluster_by: ['order_date']
          +access: public
      operations:
        +schema: marts_operations
        +tags: ['operations']
        +group: operations
        +access: protected
        dim_delivery_partners:
          +access: public
        fct_deliveries:
          +materialized: incremental
          +incremental_strategy: merge
          +unique_key: delivery_id
          +cluster_by: ['delivered_at::date', 'city_id']
          +access: public
        fct_delivery_sla:
          +materialized: incremental
          +incremental_strategy: delete+insert
          +unique_key: ['delivery_date', 'city_id']
          +cluster_by: ['delivery_date']
          +access: public

    utilities:
      +materialized: table
      +schema: utilities
      +tags: ['utilities']
      +group: platform
      +access: protected


  elementary:
    +schema: elementary


flags:
  require_generic_test_arguments_property: true

