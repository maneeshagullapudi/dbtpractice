vars:
  date_spine_start: '2020-01-01'
  date_spine_end: '2030-12-31'

  delivery_sla_minutes: 45
  churn_lookback_days: 45
  incremental_buffer_hours: 3

  bi_role: 'ZOMATO_BI_ROLE'
  default_commission_rate: 0.20

  retention_window_days_d30: 30
  retention_window_days_d60: 60
  retention_window_days_d90: 90

  model_types:
    - base
    - staging
    - intermediate
    - marts
    - other

  # Local-development toggle.
  # When true, staging models read from seeded `raw_*` tables instead of RAW sources.
  # Keep this off by default: the CSV seeds are small fallback/demo fixtures.
  # For realistic validation volume, prefer `data_generators/orchestrate.py --step dev`
  # and run dbt against generated RAW data with `use_seed_data: false`.
  use_seed_data: false


  # Reconciliation test toggle.
  # Controls `assert_order_total_matches_items`.
  # Disabled by default because the synthetic/demo dataset is not internally
  # consistent enough for this to be an always-on signal.
  enable_order_reconciliation_test: false
